<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchMind — Autonomous Multi-Agent Investigation Studio</title>
  <meta name="description" content="Production-grade autonomous research agent gateway with real-time multi-agent execution, grounded claims, and verified dossiers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-container" role="main">
    <!-- Header & Health Indicator -->
    <header id="header-container" class="header-bar" role="banner"></header>

    <!-- Inquiry Submission Studio -->
    <section id="inquiry-container" role="region" aria-label="Research Inquiry Studio"></section>

    <!-- Live Execution & Telemetry -->
    <section id="dag-container" role="region" aria-label="Multi-Agent Pipeline"></section>

    <div class="execution-split">
      <section id="event-log-container" role="region" aria-label="Live Execution Timeline" aria-live="polite"></section>
      <section id="diagnostics-container" role="region" aria-label="Run Diagnostics"></section>
    </div>

    <!-- Final Research Dossier -->
    <section id="dossier-container" role="region" aria-label="Research Dossier"></section>

    <!-- Persistent Artifacts -->
    <section id="artifacts-container" role="region" aria-label="Persistent Artifacts"></section>
  </main>

  <!-- API Key & Credentials Modal -->
  <div id="settings-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="card-title">
        <span id="modal-title">🔑 API Credentials & Tenant Settings</span>
        <button id="btn-close-modal" class="btn btn-secondary btn-sm" aria-label="Close Settings">✕</button>
      </div>

      <div style="margin-bottom: 1.25rem; color: var(--text-secondary); font-size: 0.85rem;">
        ResearchMind enforces SHA-256 digest authentication. Enter your API key below. Credentials are kept in memory by default.
      </div>

      <div class="form-group">
        <label class="form-label" for="modal-api-key">API Key (Bearer / X-API-Key)</label>
        <input
          id="modal-api-key"
          type="password"
          class="form-input"
          placeholder="Enter API key..."
          autocomplete="off"
        />
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
        <input type="checkbox" id="modal-remember-key" style="cursor: pointer;" />
        <label for="modal-remember-key" style="font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
          Remember in this browser session (sessionStorage)
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <button id="btn-clear-key" class="btn btn-secondary">Clear</button>
        <button id="btn-save-key" class="btn btn-primary">Save Key</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
