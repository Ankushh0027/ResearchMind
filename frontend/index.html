<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchMind — Evidence-Grounded Multi-Agent Research System</title>
  <meta name="description" content="Autonomous multi-agent research platform compiling verified, citation-backed investigative dossiers from primary literature.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation & System Health -->
    <header id="header-container" class="header-bar" role="banner"></header>

    <!-- Main Dynamic Screen Container -->
    <main id="main-content" role="main">
      <!-- Screen 1: Clean Research Inquiry Input -->
      <section id="screen-input" class="screen-view" role="region" aria-label="Research Input"></section>

      <!-- Screen 2: Live Multi-Agent Investigation -->
      <section id="screen-investigating" class="screen-view" style="display: none;" role="region" aria-label="Live Investigation"></section>

      <!-- Screen 3: Final Research Report & Dossier -->
      <section id="screen-report" class="screen-view" style="display: none;" role="region" aria-label="Final Research Report"></section>
    </main>
  </div>

  <!-- API Credentials Modal -->
  <div id="settings-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="card-title">
        <span id="modal-title">🔑 API Credentials & Tenant Settings</span>
        <button id="btn-close-modal" class="btn btn-secondary btn-sm" aria-label="Close Settings">✕</button>
      </div>

      <div style="margin-bottom: 1.25rem; color: var(--text-secondary); font-size: 0.875rem; line-height: 1.5;">
        ResearchMind enforces SHA-256 binary key digest authentication. Enter your API key below. Credentials are kept in memory by default.
      </div>

      <div class="form-group">
        <label class="form-label" for="modal-api-key">API Key (Bearer / X-API-Key)</label>
        <input
          id="modal-api-key"
          type="password"
          class="form-input"
          placeholder="Enter API key..."
          autocomplete="off"
        />
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
        <input type="checkbox" id="modal-remember-key" style="cursor: pointer;" />
        <label for="modal-remember-key" style="font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
          Remember in this browser session (sessionStorage)
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <button id="btn-clear-key" class="btn btn-secondary">Clear</button>
        <button id="btn-save-key" class="btn btn-primary">Save Key</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
