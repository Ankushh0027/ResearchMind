apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: researchmind-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "ResearchMind Autonomous Multi-Agent API Gateway"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/researchmind:latest
        command:
        - python
        - -m
        - uvicorn
        - app.api.app:create_app
        - --factory
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2048Mi
        env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: INFO
        - name: STORAGE_BACKEND
          value: gcs
        - name: GCS_BUCKET_NAME
          value: PROJECT_ID-researchmind-artifacts
        - name: PUBSUB_PROJECT_ID
          value: PROJECT_ID
        - name: PUBSUB_TASKS_TOPIC
          value: researchmind-tasks
        - name: PUBSUB_TASKS_SUBSCRIPTION
          value: researchmind-tasks-sub
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
